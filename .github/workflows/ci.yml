name: Continuous Integration

on: 
  push:
   branches:
    - master
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      REACT_APP_UID: ${{ secrets.REACT_APP_UID }}
      REACT_APP_FIREBASE_CONFIG: ${{ secrets.REACT_APP_FIREBASE_CONFIG }}
      SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: |
          npm ci
          npm run pw
          npm run lint
          npm run test

  firebase-admin:
    name: firebase-admin ${{ matrix.firebase-admin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebase-admin: [12, 13, 14]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # The unit tests mock firebase-admin, so this installs each supported
      # major and mints a real custom token through the built plugin.
      - run: |
          npm ci
          npm install --no-save firebase-admin@${{ matrix.firebase-admin }}
          npm run build
          node tests/smoke/mint-token.mjs

  automerge:
    name: Merge dependabot's PRs
    needs: [test, firebase-admin]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
